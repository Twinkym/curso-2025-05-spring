<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="David De La Puente - Kirgo">
    <title th:text="'Detalle - ' + ${producto.nombre}">Detalle del Producto</title>
    <!-- Bootstrap 5 CDN-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CDN-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
<div th:if="${producto}">
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white">
                <i class="fas fa-info-circle"></i>
                <h3 class="mb-0" th:text="${producto.nombre}">Detalle del Producto</h3>
            </div>
            <div th:if="${error}">
                <p class="alert alert-danger" th:text="${error}">Error</p>
            </div>
            <div class="card-body">
                <p><strong>ID:</strong> <span th:text="${producto.id}"></span></p>
                <p><strong>Nombre:</strong> <span th:text="${producto.nombre}"></span></p>
                <p><strong>Precio:</strong> <span th:text="${#numbers.formatDecimal(producto.precio, 1, 2)} + ' €'"></span></p>
                <p><strong>Stock:</strong> <span th:text="${producto.stock}"></span></p>
                <p><strong>Disponible:</strong> <span th:text="${producto.disponible ? 'Sí' : 'No'}"></span></p>
                <div th:if="${producto.categoria != null}">
                    <p><strong>Categoria:</strong> <span th:text="${producto.categoria.nombre}"></span></p>
                </div>
                <a th:href="@{/productos}" class="btn btn-secondary mt-3">Volver al listado</a>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
