<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="David De La Puente - Kirgo">
    <title>Lista de productos</title>
    <!-- Bootstrap 5 CDN-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CDN-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div th:if="${mensaje" class="alert" th:classappend="${tipoMensaje}" role="alert">
        <span th:text="${mensaje}"></span>
    </div>
    <h1 class="mb-4 text-primary">Listado de productos</h1>
    <form th:action="@{/productos}" method="get" class="row g-3 mb-4">
        <div class="col-md-4">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre del producto" th:value="${nombre}">
        </div>
        <!-- Seleccionar categoría -->
        <div class="col-md-4">
            <label for="categoria" class="form-label">Categoria</label>
            <select id="categoria" name="categoriaId" class="form-select">
                <option value="">-- Seleccione una categoría --</option>
                <option th:each="categoria : ${categorias}"
                        th:value="${categoria.id}"
                        th:text="${categoria.nombre}"
                        th:selected="${categoria.id == filtro.categoriaId}">
                </option>
            </select>
        </div>
        <div class="col-md-4">
            <label for="disponible" class="form-label">Disponible</label>
            <select name="disponible" id="disponible" class="form-select">
                <option value="">-- Todos --</option>
                <option value="true" th:selected="${filtro.disponible}">Sí</option>
                <option value="false" th:selected="${!filtro.disponible}">No</option>
            </select>
        </div>
        <div class="col-12 text-end">
            <button type="submit" class="btn btn-primary">Filtrar</button>
        </div>
    </form>

    <!-- Tabla de Productos -->
    <div class="table-responsive" th:unless="${productos.isEmpty()}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nombre</th>
                <th scope="col">Precio</th>
                <th scope="col">Stock</th>
                <th scope="col">Disponible</th>
                <th scope="col">Categoria</th>
                <th scope="col">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <!-- Iterar sobre los productos -->
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.id}"></td>
                    <td th:text="${producto.nombre}"></td>
                    <td th:text="${#numbers.formatDecimal(producto.precio, 1, 2)} + ' €'"></td>
                    <td th:text="${producto.stock} + (${producto.stock == 1} ? ' Ud.' : ' Uds.')"></td>
                    <td th:text="${producto.disponible ? 'Sí' : 'No'}" th:class="${producto.disponible ? 'disponible' : 'no-disponible'}"></td>
                    <td th:text="${producto.categoria != null ? producto.categoria.nombre : 'Sin categoria'}"></td>
                    <!-- Acciones -->
                    <td>
                        <a th:href="@{/productos/{id}(id=${producto.id})}" class="btn btn-primary btn-sm">Ver detalles</a>
                        <a th:href="@{/productos/editar/{id}(id=${producto.id})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estas seguro de eliminar este producto?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <!-- Botón para crear un nuevo producto que abre el modal -->
    <button type="button" class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#nuevoProductoModal">
        <i class="fas fa-plus-circle"></i> Agregar nuevo producto
    </button>
</div>
<!-- Modal para crear un nuevo producto -->-->
<div class="modal fade" id="nuevoProductoModal" tabindex="-1" aria-labelledby="nuevoProductoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="nuevoProductoModalLabel">Agregar Nuevo Producto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <form th:action="@{/productos/nuevo}" method="post" th:object="${producto}">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nombre
                            <input type="text" class="form-control" th:field="*{nombre}" placeholder="Nombre del producto" required>
                        </label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Categoria
                            <select class="form-select" th:field="*{categoria}">
                                <option value="">-- Seleccione una categoría --</option>
                                <option th:each="cat : ${categorias}"
                                        th:value="${cat.id}"
                                        th:text="${cat.nombre}"></option>
                            </select>
                        </label>
                    </div>
                    <div class="mb-3">
                        <label  class="form-label">Precio
                            <input type="number" step="0.01" class="form-control" th:field="*{precio}" placeholder="Precio del producto" required>
                        </label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Stock
                            <input type="number" class="form-control" th:field="*{stock}" placeholder="Stock del producto" required>
                        </label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Disponible
                            <select class="form-select" th:field="*{disponible}">
                                <option th:value="true">Sí</option>
                                <option th:value="false">No</option>
                            </select>
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
